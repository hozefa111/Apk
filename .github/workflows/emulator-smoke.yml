name: Emulator Playback Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Create sample video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=15 -t 24 -c:v mpeg4 -q:v 8 -pix_fmt yuv420p -y smoke.mp4
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disk-size: 6144M
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.orbitplayer.app android.permission.READ_MEDIA_VIDEO || true
            adb wait-for-device
            adb shell mkdir -p /sdcard/Download
            # The emulator can briefly disconnect while media storage initializes.
            # Retry file transfer rather than reporting an app crash.
            push_ok=false
            for attempt in 1 2 3 4 5; do
              if adb push smoke.mp4 /sdcard/Download/orbit_smoke.mp4; then
                push_ok=true
                break
              fi
              adb wait-for-device || true
              sleep 5
            done
            if [ "$push_ok" != true ]; then
              echo "Emulator media transfer failed: infrastructure unavailable"
              exit 1
            fi
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/orbit_smoke.mp4 || true
            sleep 8
            adb logcat -c
            adb shell am start -n com.orbitplayer.app/.MainActivity
            sleep 3
            adb shell am start -n com.orbitplayer.app/.PlayerActivity --es video_uri file:///sdcard/Download/orbit_smoke.mp4
            sleep 8
            adb shell dumpsys activity activities > activity-state.txt
            adb logcat -d -v time > emulator-logcat.txt
            adb shell input tap 180 400 || true
            sleep 1
            adb shell screencap -p /sdcard/Download/orbit_screenshot.png || true
            adb pull /sdcard/Download/orbit_screenshot.png orbit-smoke-screen.png || true
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            sleep 4
            adb shell input tap 400 180 || true
            adb shell screencap -p /sdcard/Download/orbit_landscape.png || true
            adb pull /sdcard/Download/orbit_landscape.png orbit-landscape-screen.png || true
            if grep -E 'FATAL EXCEPTION|Process: com\.orbitplayer\.app' emulator-logcat.txt; then
              echo "Detected fatal Android exception"
              exit 1
            fi
            if ! adb shell pidof com.orbitplayer.app >/dev/null; then
              echo "App process has died"
              exit 1
            fi
            echo "App process still alive after player startup"
      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-playback-smoke-logs
          path: |
            emulator-logcat.txt
            activity-state.txt
            orbit-smoke-screen.png
            orbit-landscape-screen.png
          if-no-files-found: ignore
