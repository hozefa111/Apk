name: Emulator Playback Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Native playback / Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Create playable H264/AAC test media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x240:rate=15 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 28 -c:v libx264 -preset ultrafast -profile:v baseline \
            -pix_fmt yuv420p -c:a aac -b:a 64k -movflags +faststart -y smoke.mp4
      - name: Generate compatibility fixtures
        run: python3 scripts/create_media_fixtures.py qa/media
      - name: Check KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Native playback and UX smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          disk-size: 4096M
          disable-animations: true
          script: |
            bash scripts/run_emulator_smoke.sh
            python3 scripts/run_permission_smoke.py
            gradle --no-daemon :app:connectedDebugAndroidTest
            python3 scripts/run_media_matrix.py qa/media
      - name: Upload emulator QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-playback-smoke-logs-api-${{ matrix.api }}
          path: |
            qa/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
