name: Native safety and sandbox verification
on:
  push:
    branches: [three-patti-pro-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install -g firebase-tools@14.17.0
      - name: Compile and run parity, safety and lint checks
        run: gradle -p 3PattiProNative testDebugUnitTest lintDebug assembleDebug assembleSandbox assembleSandboxAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise isolated native app and Firebase writes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: firebase emulators:exec --project demo-three-patti --only auth,firestore --config 3PattiProNative/tests/emulator/firebase.json "python3 3PattiProNative/scripts/seed_emulator.py && gradle -p 3PattiProNative connectedSandboxAndroidTest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification-reports-api-${{ matrix.api }}
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/outputs/androidTest-results/
