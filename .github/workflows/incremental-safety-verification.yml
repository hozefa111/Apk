name: Incremental safety Android verification
on:
  push:
    branches: [incremental-safety-fixes, issue-27-sync-verification]
    paths:
      - '3PattiProNative/app/src/main/java/**'
      - '3PattiProNative/app/src/androidTest/**'
      - '3PattiProNative/scripts/**'
      - '.github/workflows/incremental-safety-verification.yml' 
permissions:
  contents: read
concurrency:
  group: incremental-safety-android
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install -g firebase-tools@14.17.0
      - name: Compile isolated SDK/cache tests
        run: gradle -p 3PattiProNative testDebugUnitTest assembleSandbox assembleSandboxAndroidTest lintDebug
      - run: sudo chmod 666 /dev/kvm
      - name: Verify tracker SDK, cache, concurrency and quota recovery
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KALI_REQUIRE_APP_EVIDENCE: '0'
          KALI_TEST_CLASSES: com.hozefa.threepattipro.nativeapp.TrackerCacheTest,com.hozefa.threepattipro.nativeapp.FirebaseGatewayEmulatorTest
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: false
          script: bash 3PattiProNative/scripts/run_sandbox_verification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incremental-safety-android-verification-${{ matrix.api }}
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/outputs/androidTest-results/
            3PattiProNative/app/build/verification-screenshots/
