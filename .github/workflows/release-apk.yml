name: Publish Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate XML
        run: python3 scripts/check_layouts.py

      - name: Build with private signing key
        id: signing
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
          ORBIT_SIGN_PASSWORD: ${{ secrets.ORBIT_SIGN_PASSWORD }}
        shell: bash
        run: |
          # Text file copy/paste can accidentally include a CR/LF at the end of the password.
          # Normalize only line endings; never print or commit the signing secret.
          ORBIT_SIGN_PASSWORD="$(printf '%s' "$ORBIT_SIGN_PASSWORD" | tr -d '\r\n')"
          export ORBIT_SIGN_PASSWORD
          if [ -z "$ORBIT_KEYSTORE_B64" ] || [ -z "$ORBIT_SIGN_PASSWORD" ]; then
            echo "Signing secrets not yet configured. Release skipped; debug build workflow remains usable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$ORBIT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orbit-player-release.p12"
          export ORBIT_KEYSTORE_PATH="$RUNNER_TEMP/orbit-player-release.p12"
          keytool -list -storetype PKCS12 -keystore "$ORBIT_KEYSTORE_PATH" -storepass "$ORBIT_SIGN_PASSWORD" -alias orbitplayer >/dev/null
          gradle --no-daemon :app:assembleRelease :app:testReleaseUnitTest
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPlayer-SIGNED-v0.1.5
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 60

      - name: Publish update to GitHub Releases
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then echo "Missing versionName"; exit 1; fi
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "OrbitPlayer-$TAG.apk"
          sha256sum "OrbitPlayer-$TAG.apk" > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "OrbitPlayer-$TAG.apk" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "OrbitPlayer-$TAG.apk" SHA256SUMS.txt --title "Orbit Player $TAG" --notes "Signed, lightweight offline video player. Use the in-app Updates button for future versions."
          fi
