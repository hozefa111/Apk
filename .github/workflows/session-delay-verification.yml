name: Session opening latency verification
on:
  push:
    branches: [fix/session-open-delay]
permissions:
  contents: read
jobs:
  latency:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      KALI_TEST_CLASSES: com.hozefa.threepattipro.nativeapp.SessionDelayTest,com.hozefa.threepattipro.nativeapp.SessionLeaderboardUiTest
      KALI_REQUIRE_APP_EVIDENCE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install -g firebase-tools@14.17.0
      - run: sudo chmod 666 /dev/kvm
      - name: Measure original worker queue and first displayed scoreboard frame
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash 3PattiProNative/scripts/measure_session_delay.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-delay-${{ matrix.api }}
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/outputs/androidTest-results/
