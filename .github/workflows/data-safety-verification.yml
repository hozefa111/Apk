name: Data corrections and safety verification
on:
  push:
    branches: [fix/session-corrections-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            gpu: software
          - api: 30
            gpu: software
          - api: 35
            gpu: lavapipe
    env:
      JAVA_TOOL_OPTIONS: -Xmx768m
      NODE_OPTIONS: --max-old-space-size=512
      KALI_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm ci --prefix 3PattiProNative/tests/online-backend/functions/online --no-audit --no-fund && npm install -g firebase-tools@15.34.0 --no-audit --no-fund
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -memory 2048 -no-snapshot -noaudio -no-boot-anim
          script: bash 3PattiProNative/scripts/verify_data_safety.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-safety-${{ matrix.api }}
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/outputs/androidTest-results/
