name: Kali online Android integration
on:
  workflow_dispatch:
  pull_request:
    paths: ['3PattiProNative/**', '.github/workflows/kali-online-android.yml']
  push:
    branches: [kali-tidi-multiplayer]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm ci --prefix 3PattiProNative/tests/online-backend/functions/online
      - run: npm install --global firebase-tools@14.17.0
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash 3PattiProNative/scripts/verify_online_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kali-android-api-${{ matrix.api }}
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/test-results/
            3PattiProNative/app/build/outputs/androidTest-results/
            3PattiProNative/app/build/verification/
