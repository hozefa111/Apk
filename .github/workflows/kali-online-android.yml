name: Kali online Android integration
on:
  workflow_dispatch:
  pull_request:
    paths: ['3PattiProNative/**', '.github/workflows/kali-online-android.yml']
  push:
    branches: [kali-tidi-multiplayer]
permissions:
  contents: read
concurrency:
  group: kali-online-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Firestore, Gradle and the Android 15 VM share the hosted runner.
      # Unbounded JVM ergonomics can otherwise evict the emulator mid-suite.
      JAVA_TOOL_OPTIONS: -Xmx768m
      NODE_OPTIONS: --max-old-space-size=512
      KALI_TEST_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            shard: all
          - api: 35
            shard: 0
          - api: 35
            shard: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm ci --prefix 3PattiProNative/tests/online-backend/functions/online --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2
        timeout-minutes: 6
      - run: npm install --global firebase-tools@15.34.0 --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2
        timeout-minutes: 6
      - name: Provision Android platform with download retries
        run: |
          KALI_SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$KALI_SDKMANAGER"
          for attempt in 1 2 3; do
            if "$KALI_SDKMANAGER" --install "platforms;android-${{ matrix.api }}" "build-tools;35.0.0"; then
              exit 0
            fi
          done
          exit 1
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: bash 3PattiProNative/scripts/verify_online_android.sh
      - name: Collect host resource diagnostics
        if: always()
        run: |
          mkdir -p 3PattiProNative/app/build/verification
          free -m > 3PattiProNative/app/build/verification/host-memory.txt
          sudo dmesg -T | tail -n 160 > 3PattiProNative/app/build/verification/host-kernel.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kali-android-api-${{ matrix.api }}-${{ matrix.shard }}
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/test-results/
            3PattiProNative/app/build/outputs/androidTest-results/
            3PattiProNative/app/build/verification/
