name: Controlled native data audit benchmark
on:
  push:
    branches: [benchmark/tracker-v26]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      JAVA_TOOL_OPTIONS: -Xmx768m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install -g firebase-tools@15.34.0 --no-audit --no-fund
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu software -memory 2048 -no-snapshot -noaudio -no-boot-anim
          script: bash 3PattiProNative/scripts/measure_data_audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-data-benchmark
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/outputs/androidTest-results/
