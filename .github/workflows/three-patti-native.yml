name: Build 3 Patti PRO Native APK

on:
  push:
    branches: [three-patti-pro-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native Android source
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon --project-dir 3PattiProNative clean testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK package and native code
        run: |
          set -euo pipefail
          apk=3PattiProNative/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          ! grep -R 'android.webkit.WebView' 3PattiProNative/app/src/main/java
          ! unzip -Z1 "$apk" | grep -E '^assets/.*(html|js|css)$'
          test "$(stat -c %s "$apk")" -gt 50000
          echo "Native APK verified"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3-Patti-PRO-NATIVE-APK
          path: 3PattiProNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
