name: 3 Patti PRO Native Android Smoke

on:
  push:
    branches: [three-patti-pro-native]
    paths:
      - '3PattiProNative/**'
      - '.github/workflows/three-patti-native-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release variant and run scoring tests
        # This disposable identity tests the release variant. The distributed APK
        # is signed separately with the owner-approved stable key, never sent to CI.
        run: |
          export THREE_PATTI_STORE_FILE="$RUNNER_TEMP/smoke-release.p12"
          export THREE_PATTI_STORE_PASSWORD="$(openssl rand -hex 24)"
          export THREE_PATTI_KEY_PASSWORD="$THREE_PATTI_STORE_PASSWORD"
          export THREE_PATTI_KEY_ALIAS=smoke-release
          keytool -genkeypair -keystore "$THREE_PATTI_STORE_FILE" -storetype PKCS12 -storepass:env THREE_PATTI_STORE_PASSWORD -keypass:env THREE_PATTI_KEY_PASSWORD -alias "$THREE_PATTI_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Disposable release verification"
          gradle --no-daemon --project-dir 3PattiProNative testReleaseUnitTest lintRelease assembleRelease
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and exercise native navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            # Release UI smoke is offline; Firebase integration uses the demo project.
            adb shell svc wifi disable
            adb shell svc data disable
            adb install 3PattiProNative/app/build/outputs/apk/release/app-release.apk
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 8
            python3 3PattiProNative/scripts/smoke_navigation.py
