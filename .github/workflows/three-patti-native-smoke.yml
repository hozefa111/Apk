name: 3 Patti PRO Native Android Smoke

on:
  push:
    branches: [three-patti-pro-native]
    paths:
      - '3PattiProNative/**'
      - '.github/workflows/three-patti-native-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build CURRENT source and run scoring tests
        run: gradle --no-daemon --project-dir 3PattiProNative testDebugUnitTest assembleDebug
      - name: Boot Android and exercise native navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            set -eu
            adb install 3PattiProNative/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 6
            adb shell pidof com.hozefa.threepattipro.nativeapp
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb exec-out cat /sdcard/window.xml > window.xml
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            def tap(label):
                subprocess.run(['adb','shell','uiautomator','dump','/sdcard/window.xml'],capture_output=True,check=True)
                xml=subprocess.check_output(['adb','exec-out','cat','/sdcard/window.xml']).decode()
                for item in ET.fromstring(xml).iter('node'):
                    if item.attrib.get('text') == label:
                        nums=list(map(int,re.findall(r'\d+',item.attrib.get('bounds',''))))
                        if len(nums)!=4: continue
                        x=(nums[0]+nums[2])//2;y=(nums[1]+nums[3])//2
                        subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
                        return
                raise AssertionError('Missing native navigation label: '+label)
            tap('Ranks')
            subprocess.run(['adb','shell','pidof','com.hozefa.threepattipro.nativeapp'],check=True)
            tap('Home')
            subprocess.run(['adb','shell','pidof','com.hozefa.threepattipro.nativeapp'],check=True)
            tap('Players')
            subprocess.run(['adb','shell','pidof','com.hozefa.threepattipro.nativeapp'],check=True)
            tap('History')
            subprocess.run(['adb','shell','pidof','com.hozefa.threepattipro.nativeapp'],check=True)
            print('Native install, launch, Ranks/Home/Players/History taps passed')
            PY
            adb logcat -d -v brief | grep -F 'FATAL EXCEPTION' > /tmp/patti-crashes.txt || true
            if [ -s /tmp/patti-crashes.txt ]; then cat /tmp/patti-crashes.txt; exit 1; fi
            echo "Native navigation smoke passed; Auth/Firestore writes not exercised"
