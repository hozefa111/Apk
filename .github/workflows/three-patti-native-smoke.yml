name: 3 Patti PRO Native Android Smoke

on:
  push:
    branches: [three-patti-pro-native]
    paths:
      - '3PattiProNative/**'
      - '.github/workflows/three-patti-native-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build CURRENT source and run scoring tests
        run: gradle --no-daemon --project-dir 3PattiProNative testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and exercise native navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            adb install 3PattiProNative/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 8
            python3 3PattiProNative/scripts/smoke_navigation.py
