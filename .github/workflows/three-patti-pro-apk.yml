name: Build 3 Patti PRO Fixed APK

on:
  push:
    branches: [three-patti-pro-android]
    paths:
      - '3PattiProAndroid/**'
      - '.github/workflows/three-patti-pro-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Android source
        uses: actions/checkout@v4

      - name: Checkout original HH web source without modifying it
        uses: actions/checkout@v4
        with:
          repository: hozefa111/hh
          ref: 8b2189d28d7bd9d9c21f509e87bf89717816898f
          path: hh-original
          persist-credentials: false

      - name: Bundle original UI and existing Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          dest=3PattiProAndroid/app/src/main/assets
          mkdir -p "$dest"
          for file in index.html style.css app.js firebase-config.js notifications.js manifest.json icon-192.png icon-512.png service-worker.js sw.js; do
            test -s "hh-original/$file"
            cp "hh-original/$file" "$dest/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          target = Path("3PattiProAndroid/app/src/main/assets/index.html")
          original = target.read_text(encoding="utf-8")
          # Changes are ONLY to this temporary Android bundle, never to the HH source.
          updated = original.replace('href="/manifest.json"', 'href="manifest.json"')
          updated = updated.replace('href="/icon-192.png"', 'href="icon-192.png"')
          updated = updated.replace("navigator.serviceWorker.register('/service-worker.js');", "console.info('Native Android APK: service worker managed by OS');")
          assert updated != original
          assert 'firebase-config.js' in updated and 'app.js' in updated
          target.write_text(updated, encoding="utf-8")
          assert Path("3PattiProAndroid/app/src/main/assets/app.js").stat().st_size > 100000
          assert "patti-pro-a61d8" in Path("3PattiProAndroid/app/src/main/assets/firebase-config.js").read_text()
          print("Original game data/UI assets bundled; existing Firebase project preserved")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle --no-daemon --project-dir 3PattiProAndroid clean assembleDebug --stacktrace

      - name: Validate APK contains the entire game and launcher
        shell: bash
        run: |
          set -euo pipefail
          apk=3PattiProAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          test "$(stat -c %s "$apk")" -gt 100000
          unzip -l "$apk" | grep -q 'assets/index.html'
          unzip -l "$apk" | grep -q 'assets/app.js'
          unzip -l "$apk" | grep -q 'assets/firebase-config.js'
          unzip -l "$apk" | grep -q 'assets/style.css'
          unzip -l "$apk" | grep -q 'resources.arsc'
          echo "Verified: APK includes original game source, Firebase config, and Android resources"

      - name: Upload directly installable APK
        uses: actions/upload-artifact@v4
        with:
          name: 3-Patti-PRO-FIXED-APK
          path: 3PattiProAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
