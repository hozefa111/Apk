name: Verify and publish session leaderboard release
on:
  workflow_dispatch:
  push:
    branches: [release-v2.7.19]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate and download stable previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c release-candidates/SHA256SUMS.txt
          gh release download three-patti-pro-v2.7.18 -p '*.apk' -D previous
      - run: sudo chmod 666 /dev/kvm
      - name: Update stable app and restore actual old SQLite cache
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash release-candidates/run-upgrade.sh
      - name: Publish only after upgrade and matching web deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL 'https://hozefa111.github.io/hh/app.js?v=2.7.19' -o published-app.js
          curl -fsSL 'https://hozefa111.github.io/hh/tracker-sync.js?v=2.7.19' -o published-sync.js
          echo 'cfc8eacac46d5aeb2df2d3c59e8b92de7d71db98f7b06a6c99a5c92734633c58  published-app.js' | sha256sum -c -
          echo '704eb6e84ae2d6f981f9d3b8f7db12724d8006680af6a9df0621bbee1bc39c9b  published-sync.js' | sha256sum -c -
          gh release create three-patti-pro-v2.7.19 release-candidates/3-Patti-PRO-v2.7.19.apk release-candidates/SHA256SUMS.txt --target c95a640e938e4b71cb6ae3878ca6ad7d16e90648 --title '3 Patti PRO v2.7.19' --notes-file release-candidates/NOTES.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-leaderboard-release-upgrade
          path: upgrade-evidence/
