name: Verify stable release update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download existing release and private candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download three-patti-pro-v2.7.12 -p '*.apk' -D previous
          gh release download three-patti-pro-v2.7.14 -p '*.apk' -D candidate
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb shell svc wifi disable
            adb shell svc data disable
            adb install previous/*.apk
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 5
            adb shell mkdir -p /data/user/0/com.hozefa.threepattipro.nativeapp/files
            adb shell touch /data/user/0/com.hozefa.threepattipro.nativeapp/files/upgrade-verification-marker
            adb install -r candidate/*.apk
            adb shell test -f /data/user/0/com.hozefa.threepattipro.nativeapp/files/upgrade-verification-marker
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 8
            adb shell pidof com.hozefa.threepattipro.nativeapp
            adb shell dumpsys package com.hozefa.threepattipro.nativeapp | grep 'versionName=2.7.13'
