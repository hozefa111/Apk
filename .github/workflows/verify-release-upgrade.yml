name: Verify signed v2.7.22 update
on:
  push:
    branches: [verification-v2.7.22]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify focused tests and candidate checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 40448052172 --repo hozefa111/Apk --json conclusion --jq .conclusion | grep -x success
          sha256sum -c release-candidates/SHA256SUMS.txt
          gh release download three-patti-pro-v2.7.21-rc.1 -p '*.apk' -D previous
      - run: sudo chmod 666 /dev/kvm
      - name: Retain installed v2.7.21 data during signed update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash release-candidates/run-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2.7.22-signed-upgrade-proof
          path: upgrade-evidence/
