name: Verify signed v2.7.28 upgrade
on:
  push:
    branches: [verification-v2.7.28]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify the candidate and fetch previous signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c release-candidates/SHA256SUMS.txt
          gh release download three-patti-pro-v2.7.27 -p '*.apk' -D previous
          echo '18da8f7d3b1ddfb0999b3a228071cc361ee2a8ba3efa2fe269e29ea7fc1107bd  previous/3-Patti-PRO-v2.7.27.apk' | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu software -memory 2048 -no-snapshot -noaudio -no-boot-anim
          script: bash release-candidates/run-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-v27-upgrade-evidence
          path: upgrade-evidence/
