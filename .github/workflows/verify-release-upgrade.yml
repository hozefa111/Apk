name: Verify signed v2.7.26 upgrade
on:
  push:
    branches: [verification-v2.7.26]
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        previous: ['2.7.23', '2.7.25']
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact passed save checks and resolved WebView cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 40503129609 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 40503129609 --json headSha --jq .headSha)" = 04ef681afe453f65ea8e177026ec93862b9fd4ab
          test "$(gh api repos/hozefa111/Apk/actions/jobs/122177973708 --jq .conclusion)" = success
          test "$(gh api repos/hozefa111/Apk/actions/jobs/122177974140 --jq .conclusion)" = success
          gh run download 40500883711 -n round-save-26 -D prior-android8
          python3 - <<'CHECK'
          from pathlib import Path
          import xml.etree.ElementTree as E
          required={'manualSaveRetainsPlayersResetsFieldsAndAcceptsNextRound','failedSaveRetainsOriginalDraftAndRetriesOnce','lostConfirmationRetryUsesAlreadyCommittedIdWithoutDuplicate','confirmedVoiceRoundCreatesExactlyOneSandboxRecord','offlineConfirmationCannotChangeOrSaveManualDraft','largeFontLandscapeKeepsHistoryAndShareActionsOnScreen'}
          found=set()
          for p in Path('prior-android8').rglob('TEST-*.xml'):
              for t in E.parse(p).getroot().iter('testcase'):
                  if t.get('name') in required:
                      assert t.find('failure') is None and t.find('skipped') is None
                      found.add(t.get('name'))
          assert found==required, found
          CHECK
          git fetch origin 04d8958580c2682f51b84203d5f24b9d376a1c48 04ef681afe453f65ea8e177026ec93862b9fd4ab --depth=1
          git diff --exit-code 04d8958580c2682f51b84203d5f24b9d376a1c48 04ef681afe453f65ea8e177026ec93862b9fd4ab -- 3PattiProNative/app/src/main 3PattiProNative/app/build.gradle.kts
          sha256sum -c release-candidates/SHA256SUMS.txt
          gh release download three-patti-pro-v${{ matrix.previous }} -p '*.apk' -D previous
      - run: sudo chmod 666 /dev/kvm
      - name: Preserve installed app and data during signed upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash release-candidates/run-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2.7.26-upgrade-${{ matrix.previous }}
          path: upgrade-evidence/
