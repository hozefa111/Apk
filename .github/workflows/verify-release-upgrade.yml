name: Verify signed Incremental Sync candidate
on:
  push:
    branches: [verification-v2.7.21]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate and obtain previous stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c release-candidates/SHA256SUMS.txt
          gh release download three-patti-pro-v2.7.20 -p '*.apk' -D previous
      - run: sudo chmod 666 /dev/kvm
      - name: Preserve signed installation, SQLite cache and score screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash release-candidates/run-upgrade.sh
      - name: Confirm critical source checks before publishing verification candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 40321160867 --repo hozefa111/Apk --exit-status
          gh run watch 40322944086 --repo hozefa111/hh --exit-status
          gh release create three-patti-pro-v2.7.21-rc.1 release-candidates/3-Patti-PRO-v2.7.21.apk release-candidates/SHA256SUMS.txt --target 85816f6 --prerelease --title '3 Patti PRO 2.7.21 verification candidate — activation BLOCKED' --notes-file release-candidates/NOTES.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-27-signed-upgrade-proof
          path: upgrade-evidence/
