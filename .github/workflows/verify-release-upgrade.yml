name: Verify stable release update
on:
  workflow_dispatch:
  push:
    branches: [release-v2.7.13]
permissions:
  contents: write
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download existing release and private candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download three-patti-pro-v2.7.12 -p '*.apk' -D previous
          sha256sum -c release-candidates/SHA256SUMS.txt
          mkdir candidate
          cp release-candidates/*.apk candidate/
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb shell svc wifi disable
            adb shell svc data disable
            adb install previous/*.apk
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 5
            adb shell mkdir -p /data/user/0/com.hozefa.threepattipro.nativeapp/files
            adb shell touch /data/user/0/com.hozefa.threepattipro.nativeapp/files/upgrade-verification-marker
            adb install -r candidate/*.apk
            adb shell test -f /data/user/0/com.hozefa.threepattipro.nativeapp/files/upgrade-verification-marker
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 8
            adb shell pidof com.hozefa.threepattipro.nativeapp
            adb shell dumpsys package com.hozefa.threepattipro.nativeapp | grep 'versionName=2.7.13'
      - name: Require Android touch verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            status=$(gh api repos/hozefa111/Apk/actions/runs/40065601803 --jq .status)
            if [ "$status" = completed ]; then break; fi
            sleep 10
          done
          test "$(gh api repos/hozefa111/Apk/actions/runs/40065601803 --jq .conclusion)" = success
          test "$(gh api repos/hozefa111/Apk/actions/runs/40065601803 --jq .head_sha)" = e14c1dda5626f87e91387095dd8834f40ab64049
      - name: Publish verified stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload three-patti-pro-v2.7.13 release-candidates/*.apk release-candidates/SHA256SUMS.txt release-candidates/NOTES.md --clobber
          gh release edit three-patti-pro-v2.7.13 --draft=false --latest --notes-file release-candidates/NOTES.md
