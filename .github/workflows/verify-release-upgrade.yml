name: Publish verified v2.7.26
on:
  push:
    branches: [verification-v2.7.26]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact passed save checks, WebView checks and signed upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 40503129609 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 40503129609 --json headSha --jq .headSha)" = 04ef681afe453f65ea8e177026ec93862b9fd4ab
          test "$(gh run view 40504220494 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 40504220494 --json headSha --jq .headSha)" = 5555a9bc2c1cd278e5c62354dede2dc2126389f9
          sha256sum -c release-candidates/SHA256SUMS.txt
          echo '21139b88e6a56ed06126b57e1bf09fe8be816f45946748e6ab82ed3139acea98  release-candidates/3-Patti-PRO-v2.7.26.apk' | sha256sum -c -
          git fetch origin 04ef681afe453f65ea8e177026ec93862b9fd4ab 5555a9bc2c1cd278e5c62354dede2dc2126389f9 --depth=1
          git diff --exit-code 04ef681afe453f65ea8e177026ec93862b9fd4ab HEAD -- 3PattiProNative/app/src/main 3PattiProNative/app/build.gradle.kts
          git diff --exit-code 5555a9bc2c1cd278e5c62354dede2dc2126389f9 HEAD -- release-candidates/3-Patti-PRO-v2.7.26.apk
      - name: Publish the exact verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed 's@release-candidates/@@' release-candidates/SHA256SUMS.txt > /tmp/release.sha256
          cp /tmp/release.sha256 release-candidates/SHA256SUMS.txt
          gh release create three-patti-pro-v2.7.26 release-candidates/3-Patti-PRO-v2.7.26.apk release-candidates/SHA256SUMS.txt release-candidates/TEST-RESULTS.json --target 04ef681afe453f65ea8e177026ec93862b9fd4ab --latest --title '3 Patti PRO v2.7.26 — Stay on Round after saving' --notes-file release-candidates/NOTES.md
