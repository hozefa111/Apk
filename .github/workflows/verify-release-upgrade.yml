name: Verify signed v2.7.25 upgrade
on:
  push:
    branches: [verification-v2.7.25]
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reuse passed Android 11 and 15 save-delete gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 40479455400 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 40474919311 --json conclusion --jq .conclusion)" = success
          sha256sum -c release-candidates/SHA256SUMS.txt
          gh release download three-patti-pro-v2.7.24 -p '*.apk' -D previous
      - run: sudo chmod 666 /dev/kvm
      - name: Preserve v2.7.24 installation and data during signed upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash release-candidates/run-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2.7.25-upgrade-proof
          path: upgrade-evidence/
