name: Verify stable release update
on:
  workflow_dispatch:
  push:
    branches: [release-v2.7.15]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download existing release and private candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download three-patti-pro-v2.7.14 -p '*.apk' -D previous
          sha256sum -c release-candidates/SHA256SUMS.txt
          mkdir candidate
          cp release-candidates/*.apk candidate/
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb shell svc wifi disable
            adb shell svc data disable
            adb install previous/*.apk
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 5
            adb shell mkdir -p /data/user/0/com.hozefa.threepattipro.nativeapp/files
            adb shell touch /data/user/0/com.hozefa.threepattipro.nativeapp/files/upgrade-verification-marker
            adb install -r candidate/*.apk
            adb shell test -f /data/user/0/com.hozefa.threepattipro.nativeapp/files/upgrade-verification-marker
            adb shell am start -n com.hozefa.threepattipro.nativeapp/.MainActivity
            sleep 8
            adb shell pidof com.hozefa.threepattipro.nativeapp
            adb shell dumpsys package com.hozefa.threepattipro.nativeapp | grep 'versionName=2.7.15'
      - name: Publish signed APK after update smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://hozefa111.github.io/hh/online/runtime/client.js?v=2.7.15" -o published-client.js
          echo "69552f0f6e7a037288f5739a5bbd2296c8bdaa480a0487fd0f00b6c771e1eba9  published-client.js" | sha256sum -c -
          gh release create three-patti-pro-v2.7.15 release-candidates/*.apk release-candidates/SHA256SUMS.txt --target a17621a2428ed7346932c376cf8428a4cd582540 --title "3 Patti PRO v2.7.15" --notes-file release-candidates/NOTES.md
