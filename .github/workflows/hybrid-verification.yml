name: Hybrid targeted Android verification
on:
  push:
    branches: [hybrid-free-tier]
permissions:
  contents: read
concurrency:
  group: hybrid-android
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install -g firebase-tools@15.34.0
      - name: Compile isolated SDK/cache tests
        run: gradle -p 3PattiProNative assembleSandbox assembleSandboxAndroidTest lintDebug
      - run: sudo chmod 666 /dev/kvm
      - name: Test tracker lazy startup, exact scores, quota recovery, cache and voice save
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KALI_TEST_CLASSES: com.hozefa.threepattipro.nativeapp.FirebaseGatewayEmulatorTest,com.hozefa.threepattipro.nativeapp.NativeQuotaTest,com.hozefa.threepattipro.nativeapp.TrackerCacheTest,com.hozefa.threepattipro.nativeapp.NativeVoiceTest#confirmedVoiceRoundCreatesExactlyOneSandboxRecord
        with:
          api-level: 30
          arch: x86_64
          disable-animations: false
          script: bash 3PattiProNative/scripts/run_sandbox_verification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-android-verification
          path: |
            3PattiProNative/app/build/reports/
            3PattiProNative/app/build/outputs/androidTest-results/
            3PattiProNative/app/build/verification-screenshots/
